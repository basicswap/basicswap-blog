# Publishes the redirect site in site/ to blog.basicswapdex.com. The blog moved
# to https://basicswapdex.com/blog, and every old address here forwards to its
# own post or tag page there. Old image addresses keep working from site/images.
# The blog as it was before the move is on the legacy branch.

name: Deploy redirects to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
